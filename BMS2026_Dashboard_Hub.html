<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Motor Sales 2026 — Executive Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Sarabun',sans-serif;
  background:#0a0a0a;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── LANDING PAGE ── */
#landing {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(255,255,255,.03) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 70%, rgba(255,255,255,.02) 0%, transparent 60%),
    #0a0a0a;
  position:relative;
}

/* subtle grid lines */
#landing::before {
  content:'';
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none;
}

.landing-header {
  text-align:center;
  margin-bottom:60px;
  position:relative;
  z-index:1;
}
.landing-eyebrow {
  font-size:11px;
  letter-spacing:.25em;
  color:#666;
  text-transform:uppercase;
  margin-bottom:14px;
}
.landing-title {
  font-family:'Kanit',sans-serif;
  font-size:clamp(28px,5vw,48px);
  font-weight:800;
  color:#fff;
  letter-spacing:.04em;
  line-height:1.1;
  margin-bottom:10px;
}
.landing-subtitle {
  font-size:14px;
  color:#555;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* ── BRAND CARDS ── */
.brand-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
  max-width:720px;
  width:100%;
  position:relative;
  z-index:1;
}

.brand-card {
  background:#111;
  border:1px solid #222;
  border-radius:20px;
  padding:48px 32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
  cursor:pointer;
  transition:all .3s cubic-bezier(.25,.46,.45,.94);
  position:relative;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
}

.brand-card::before {
  content:'';
  position:absolute; inset:0;
  opacity:0;
  transition:opacity .3s;
  border-radius:20px;
}

.brand-card.avatr::before {
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.06) 0%, transparent 70%);
}
.brand-card.deepal::before {
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.05) 0%, transparent 70%);
}

.brand-card:hover {
  transform:translateY(-6px);
  border-color:#444;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.brand-card.avatr:hover {
  border-color:#555;
  box-shadow:0 24px 60px rgba(255,255,255,.05);
}
.brand-card.deepal:hover {
  border-color:#888;
  box-shadow:0 24px 60px rgba(255,255,255,.06);
}
.brand-card:hover::before { opacity:1; }

.brand-logo-wrap {
  width:140px; height:140px;
  display:flex; align-items:center; justify-content:center;
  border-radius:16px;
  transition:all .3s;
}
.brand-card.avatr .brand-logo-wrap {
  background:#fff;
  box-shadow:0 4px 20px rgba(255,255,255,.1);
}
.brand-card.deepal .brand-logo-wrap {
  background:#ffffff;
  border:1px solid #e0e0e0;
  box-shadow:0 4px 20px rgba(0,0,0,.1);
}
.brand-card:hover .brand-logo-wrap {
  transform:scale(1.05);
}

.brand-logo {
  width:110px; height:110px;
  object-fit:contain;
}
.brand-card.avatr .brand-logo {
  filter:none;
}
.brand-card.deepal .brand-logo {
  filter:none;
}

.brand-info { text-align:center; }
.brand-name {
  font-family:'Kanit',sans-serif;
  font-size:22px; font-weight:700;
  letter-spacing:.1em;
  margin-bottom:6px;
}
.brand-card.avatr .brand-name { color:#fff; }
.brand-card.deepal .brand-name { color:#fff; }

.brand-desc {
  font-size:12px;
  color:#555;
  letter-spacing:.05em;
  text-transform:uppercase;
}

.brand-arrow {
  font-size:20px;
  opacity:0;
  transform:translateX(-8px);
  transition:all .3s;
  color:#888;
}
.brand-card:hover .brand-arrow {
  opacity:1;
  transform:translateX(0);
}

.landing-footer {
  margin-top:48px;
  font-size:11px;
  color:#333;
  letter-spacing:.08em;
  text-align:center;
  position:relative;
  z-index:1;
}

/* ── DASHBOARD FRAME ── */
#dashFrame {
  display:none;
  flex-direction:column;
  height:100vh;
}

.dash-topbar {
  background:#000;
  border-bottom:1px solid #222;
  height:44px;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  flex-shrink:0;
  z-index:500;
}

.btn-back {
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  padding:6px 14px;
  color:#ccc;
  font-size:13px;
  font-family:'Sarabun',sans-serif;
  cursor:pointer;
  transition:all .2s;
  text-decoration:none;
}
.btn-back:hover {
  background:rgba(255,255,255,.14);
  color:#fff;
  border-color:rgba(255,255,255,.25);
}
.btn-back-icon { font-size:15px; }

.topbar-brand {
  display:flex;
  align-items:center;
  gap:8px;
  margin-left:4px;
}
.topbar-logo {
  height:22px;
  object-fit:contain;
}
.topbar-label-avatr {
  font-family:'Kanit',sans-serif;
  font-size:13px;
  font-weight:600;
  color:#fff;
  letter-spacing:.06em;
}
.topbar-label-deepal {
  font-family:'Kanit',sans-serif;
  font-size:13px;
  font-weight:600;
  color:#00d4ff;
  letter-spacing:.04em;
}
.topbar-divider {
  width:1px; height:20px;
  background:rgba(255,255,255,.15);
  margin-left:4px;
}
.topbar-title {
  font-size:12px;
  color:#555;
  letter-spacing:.06em;
  text-transform:uppercase;
}

.dash-iframe-wrap {
  flex:1;
  position:relative;
  overflow:hidden;
}
.dash-iframe {
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* loading state */
.iframe-loading {
  position:absolute; inset:0;
  background:#0a0a0a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  z-index:10;
  transition:opacity .4s;
}
.iframe-loading.hidden {
  opacity:0;
  pointer-events:none;
}
.loader-ring {
  width:40px; height:40px;
  border:2px solid rgba(255,255,255,.1);
  border-top-color:rgba(255,255,255,.6);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }
.loader-text {
  font-size:12px;
  color:#444;
  letter-spacing:.1em;
  text-transform:uppercase;
}

/* ── ANIMATIONS ── */
.fade-in {
  animation:fadeIn .4s ease forwards;
}
@keyframes fadeIn {
  from{opacity:0; transform:translateY(12px);}
  to{opacity:1; transform:translateY(0);}
}

@media(max-width:560px) {
  .brand-grid {grid-template-columns:1fr; max-width:340px;}
  .brand-card {padding:36px 24px;}
  .landing-title {font-size:26px;}
}
</style>
</head>

let currentBrand = null;

function openDash(brand) {
  currentBrand = brand;
  document.getElementById('landing').style.display = 'none';
  const frame = document.getElementById('dashFrame');
  frame.style.display = 'flex';
  frame.classList.add('fade-in');

  // topbar brand info
  document.getElementById('topbarBrand').innerHTML = BRANDS[brand].label;

  // show loading
  document.getElementById('iframeLoading').classList.remove('hidden');

  // load iframe
  document.getElementById('dashIframe').src = URLS[brand];

  // update browser title
  const names = {avatr:'AVATR', deepal:'DEEPAL'};
  document.title = `${names[brand]} Dashboard — Big Motor Sales 2026`;
}

function goBack() {
  // hide frame
  document.getElementById('dashFrame').style.display = 'none';
  document.getElementById('dashFrame').classList.remove('fade-in');

  // clear iframe to free memory
  document.getElementById('dashIframe').src = '';
  currentBrand = null;

  // show landing
  const landing = document.getElementById('landing');
  landing.style.display = 'flex';
  landing.classList.remove('fade-in');
  void landing.offsetWidth; // reflow
  landing.classList.add('fade-in');
  document.title = 'Big Motor Sales 2026 — Executive Dashboard';
}

function onIframeLoad() {
  setTimeout(() => {
    document.getElementById('iframeLoading').classList.add('hidden');
  }, 600);
}
</script>
